name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install rsrc (exe icon)
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download static ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Write-Host "ffmpeg: $($exe.FullName)"

      - name: Build
        shell: pwsh
        run: |
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { "ffmpeg not found" | Tee-Object -FilePath build.log; exit 1 }
          Write-Host "using ffmpeg: $($exe.FullName)"
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          $ErrorActionPreference = 'Continue'
          ./build.ps1 -Ffmpeg $exe.FullName *>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Write-Host "build exit=$code"
          if ($code -ne 0) { exit 1 }

      - name: Report failure as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'build failed (no log captured)';
            try { body = fs.readFileSync('build.log', 'utf8').slice(-8000); } catch (e) { body = 'log read error: ' + e.message; }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `build failed: ${context.ref}`,
              body: '```\n' + body + '\n```'
            });

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HV 视频转换器 ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/HVConverter-Portable.exe
            dist/HVConverter-Setup.exe
